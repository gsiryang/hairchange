<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考头像三维试戴</title><link rel="stylesheet" href="avatar3d.css"></head><body><div id="stage"><p id="status" role="status">正在加载参考头像网格…</p><span class="badge">3D · 参考头像拟合</span></div><p class="hint">拖动旋转 · 双指或滚轮缩放</p><div class="views"><button data-angle="0">正面</button><button data-angle="0.65">斜侧</button><button data-angle="1.57">侧面</button><button data-angle="3.14">背面</button></div><h2>换一种发型</h2><div class="hairstyles"><button data-hair="crop" class="active" aria-pressed="true"><b>01</b>纹理短发<small>清爽 · 自然碎发</small></button><button data-hair="part" aria-pressed="false"><b>02</b>自然侧分<small>蓬松 · 向侧梳理</small></button><button data-hair="curtain" aria-pressed="false"><b>03</b>中分刘海<small>柔和 · 两侧垂落</small></button></div><div class="options"><label>发色 <input type="color" id="hair-color" value="#201b18"></label><label><input id="wire" type="checkbox"> 查看网格</label></div><button id="download">保存当前视角</button><p class="note">脸部由参考头像的三维关键点拟合；侧后脑、耳朵和发型为近似补全。单张正面图无法还原真实侧脸，当前不是精确扫描模型。</p><script type="module" src="avatar3d.js"></script></body></html>
